# Mantem o projeto do Supabase (plano gratuito) fora do modo pausado.
# O plano gratuito pausa o projeto apos ~7 dias sem atividade. Este workflow
# faz uma leitura minima na API do Supabase 2x por dia, o que conta como uso.
#
# Nao depende da Vercel: e um backup independente do cron em vercel.json.
# A URL e a chave "anon" abaixo ja sao publicas (vao no bundle do site web),
# entao nao ha segredo exposto aqui.

name: Supabase keep-alive

on:
  schedule:
    # 06:00 e 18:00 UTC (03:00 e 15:00 em Brasilia). Duas batidas por dia
    # dao folga caso o GitHub atrase ou pule um agendamento.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}   # permite rodar na mao pelo site do GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler uma linha via API REST do Supabase
        run: |
          set -euo pipefail
          URL="https://hkvpmebfyhnvposhxofw.supabase.co/rest/v1/exercises?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrdnBtZWJmeWhudnBvc2h4b2Z3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTUwOTQsImV4cCI6MjA5OTc5MTA5NH0.hazDQQZ5WpLQdBDBJKzTQsZ0btVTb_hXM2HPWc7vV8Q"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu HTTP $code"
          test "$code" = "200"

      - name: Tambem acordar o endpoint da Vercel (best-effort)
        continue-on-error: true
        run: curl -sS "https://app-de-acompanhamento-triatleta.vercel.app/api/keepalive" && echo
